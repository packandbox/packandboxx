<!DOCTYPE html>
<html lang="ca"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PACK & BOX — Embalatge per a empreses</title>
<style>
:root{--bg:#fafaf8;--sf:#fff;--tx:#1c1a17;--mu:#6b665e;--ln:#e6e2da;--kr:#b8895a;--krd:#8a6038;--dk:#1c1a17;--ok:#2f6b3f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15130f;--sf:#1f1c17;--tx:#f3efe8;--mu:#a49d91;--ln:#332e26;--kr:#d1a173;--krd:#e0b88e;--dk:#f3efe8;--ok:#7ccf93;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{line-height:1.1;margin:0;letter-spacing:-.02em}h2{font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:.4rem}
.w{max-width:1160px;margin:0 auto;padding:0 20px}section{padding:56px 0}
.top{background:var(--dk);color:var(--bg);font-size:.8rem;text-align:center;padding:6px 10px}
header{position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--ln)}
.nav{display:flex;align-items:center;gap:14px;height:62px}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-.03em;text-decoration:none;color:var(--tx);border:2px solid var(--tx);padding:1px 8px;border-radius:4px}
nav{display:flex;gap:16px;flex:1;font-size:.9rem}nav a{color:var(--tx);text-decoration:none}nav a:hover{color:var(--krd)}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:8px 14px;text-decoration:none;display:inline-block;transition:transform .15s,background .15s}
button:hover,.btn:hover{transform:translateY(-1px)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--kr);outline-offset:2px}
.pri{background:var(--dk);color:var(--bg);border-color:var(--dk);font-weight:600}.kr{background:var(--kr);color:#1c1a17;border-color:var(--kr);font-weight:600}
.lang button{padding:5px 9px;font-size:.8rem}.lang .on{background:var(--tx);color:var(--bg)}
#cb{position:relative}#cc{background:var(--kr);color:#1c1a17;border-radius:99px;font-size:.72rem;padding:1px 7px;margin-left:4px;font-weight:700;display:inline-block}#cc.bump{animation:b .3s}@keyframes b{50%{transform:scale(1.4)}}
#bg{display:none}
.hero{padding:64px 0 48px;background:linear-gradient(180deg,var(--sf),var(--bg))}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(2.1rem,5vw,3.6rem);animation:in .7s both}.hero p{color:var(--mu);max-width:52ch;font-size:1.1rem}.sl{font-weight:700;color:var(--krd)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.stack{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;aspect-ratio:1.2;padding:24px;border-radius:16px;background:#d9b98f;animation:in .9s .15s both}
.bx{background:#c49a65;border:2px solid #9c7544;border-radius:4px;position:relative}.bx:after{content:"";position:absolute;left:0;right:0;top:34%;height:10px;background:#e8d3b2}
.bx.a{height:55%}.bx.b{height:80%}.bx.c{height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cat{padding:18px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);text-decoration:none;color:var(--tx);display:block;transition:border-color .2s}.cat:hover{border-color:var(--kr)}
.cat span{font-size:1.8rem}.cat p{color:var(--mu);font-size:.9rem;margin:.3rem 0 0}
.fb{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.fb input,.fb select,.f input,.f select,.f textarea{font:inherit;padding:9px 11px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx);width:auto}
.pc{border:1px solid var(--ln);border-radius:12px;background:var(--sf);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}.pc:hover{box-shadow:0 8px 24px rgba(0,0,0,.08);transform:translateY(-2px)}
.im{height:150px;background:#f1e7d6;display:block;width:100%;object-fit:contain}.pb{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pb small{color:var(--mu)}.tag{font-size:.72rem;background:var(--kr);color:#1c1a17;border-radius:4px;padding:1px 6px;align-self:flex-start;font-weight:600}
.warn{font-size:.75rem;color:#b3261e;font-weight:600}.pr{font-size:1.2rem;font-weight:700;margin-top:auto}.pr small{font-weight:400}
.promo{border:1px dashed var(--kr);border-radius:12px;padding:18px;background:var(--sf)}.promo b{font-size:1.1rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.note{font-size:.85rem;color:var(--mu);margin-top:12px}
.f{display:grid;gap:12px;max-width:620px}.f label{display:grid;gap:4px;font-size:.9rem}.f input,.f select,.f textarea{width:100%}.er{color:#b3261e;font-size:.8rem}.okm{color:var(--ok);font-weight:600}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--sf);z-index:40;transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;border-left:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
#dr.open{transform:none}#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}#ov.open{opacity:1;pointer-events:auto}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--ln)}.db{flex:1;overflow:auto;padding:12px 18px}.df{padding:14px 18px;border-top:1px solid var(--ln);font-size:.9rem}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:.9rem}.q button{padding:1px 9px}.row{display:flex;justify-content:space-between}.tot{font-size:1.15rem;font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);background:var(--dk);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;transition:transform .3s;font-size:.9rem}#toast.s{transform:translate(-50%,0)}
.pend{background:var(--bg);border:1px dashed var(--ln);padding:2px 8px;border-radius:4px;color:var(--mu)}
footer{background:var(--dk);color:var(--bg);padding:40px 0;font-size:.9rem}footer a{color:var(--bg);opacity:.8;display:block;text-decoration:none;padding:2px 0}
@media(max-width:820px){nav{display:none;position:absolute;top:62px;left:0;right:0;background:var(--sf);flex-direction:column;padding:14px 20px;border-bottom:1px solid var(--ln)}nav.open{display:flex}#bg{display:block}.hg{grid-template-columns:1fr}.nav{gap:8px}.logo{font-size:1.05rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
.lg{display:block;background:var(--tx);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;aspect-ratio:7.062}
.lgo{display:block;text-decoration:none}.lgo .lg{height:24px}.hl{height:clamp(46px,8vw,78px);margin-bottom:18px;animation:in .6s both}footer .lg{background:var(--bg);height:30px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border-radius:99px;padding:7px 16px;font-size:.88rem}.chip.on{background:var(--dk);color:var(--bg);border-color:var(--dk)}#fc{display:none}
#cataleg .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}.pc{border-radius:16px}
.ph{position:relative;background:linear-gradient(#f6eddc,#eadcc4);overflow:hidden}.ph .im{height:190px;padding:14px;background:none;mix-blend-mode:multiply;transition:transform .4s}.pc:hover .im{transform:scale(1.06)}.ph .tag{position:absolute;top:10px;left:10px;z-index:1}
.pc h3{font-size:1.05rem}.cn{color:var(--krd);font-weight:600}.dm{font-size:.85rem;color:var(--mu)}
.cu{border:1px dashed var(--kr);border-radius:10px;padding:8px 10px;font-size:.82rem;margin:6px 0;display:grid;gap:6px}.cu input[type=file]{width:100%;font-size:.8rem}
.pf{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px;padding-top:10px}.pf .pr{margin:0}.qs{display:flex;gap:6px}.qs input{width:62px;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx)}

function openOrder(){const t=T[L];if(!promo().units)return;
  ordNo='PB-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+String(Math.floor(Math.random()*9000)+1000);
  $('#sheet').innerHTML=ordHTML();
  try{const s=JSON.parse(localStorage.getItem('pb_k')||'{}');ordFields.forEach(n=>{const e=$('#of').elements[n];if(e&&s[n])e.value=s[n]})}catch(e){}
  $('#o-t').textContent=t.ckt+' '+ordNo;$('#o-p').textContent=t.ckp;$('#o-d').textContent=t.ckd;$('#o-g').textContent=t.ckg;$('#o-m').textContent=t.cks;$('#o-h').textContent=t.ckh;
  $('#o-msg').innerHTML='';$('#o-msg').className='';
  $('#ord').classList.add('open');document.body.style.overflow='hidden';$('#ord').scrollTop=0}
function closeOrder(){$('#ord').classList.remove('open');document.body.style.overflow=''}
const oq=n=>{const e=$('#of').elements[n];return e?e.value.trim():''};
function ordCheck(){let first=null;['c_n','c_nif','c_a','c_p','c_cp','c_tel'].forEach(n=>{const e=$('#of').elements[n],b=!e.value.trim();e.classList.toggle('bad',b);if(b&&!first)first=e});
  const m=$('#o-msg');if(first){m.className='er2';m.textContent=T[L].ckr;first.focus();first.scrollIntoView({block:'center'});return false}
  m.className='';m.innerHTML='';if(!oq('lloc'))$('#of').elements.lloc.value=[oq('c_a'),oq('c_cp'),oq('c_p')].filter(Boolean).join(', ');return true}
function ordText(){const {r,d,base,iva,tot}=ordTotals(),ls=ordLines(),dt=new Date().toLocaleDateString('es-ES'),W=[10,12,0,10,11];
  const pad=(s,n)=>String(s).padEnd(n),rp=(s,n)=>String(s).padStart(n),o=[];
  o.push('PACK & BOX — COMANDA NÚM. '+ordNo+'    Data: '+dt,'='.repeat(64));
  o.push('Raó social: '+oq('c_n'),'NIF/CIF: '+oq('c_nif'),'ADREÇA: '+oq('c_a'),'POBLACIÓ: '+oq('c_p')+'    codi postal: '+oq('c_cp'),'TELÈFON: '+oq('c_tel'),'-'.repeat(64));
  o.push('TERMINI DE LLIURAMENT: '+oq('termini'),'LLOC DE LLIURAMENT: '+oq('lloc'),'CONDICIONS: '+oq('cond'),'TRAMETRE PER: '+oq('via'),'FORMA DE PAGAMENT: '+oq('pag'),'DESCOMPTE: '+(d>0?'-'+N(d)+' € ('+r.best.n+')':'—'),'='.repeat(64));
  o.push(pad('QUANTITAT',10)+pad('REFERÈNCIA',12)+pad('CONCEPTE',0)+'  PREU/UNIT   TOTAL','-'.repeat(64));
  ls.forEach(l=>{o.push(pad(l.q+' '+l.u,10)+pad(l.ref,12)+l.c+'  '+N(l.pr)+' €  '+N(l.tt)+' €')});
  o.push('-'.repeat(64),'Subtotal: '+N(r.sub)+' €');if(d>0)o.push('Descompte: -'+N(d)+' €');
  o.push('Base imposable: '+N(base)+' €','IVA ('+Math.round(VAT*100)+'%): '+N(iva)+' €','TOTAL: '+N(tot)+' €');
  if(oq('obs'))o.push('','Observacions: '+oq('obs'));
  return o.join('\r\n')}
function ordEmailHTML(){const sh=$('#sheet'),live=[...sh.querySelectorAll('*')],cl=sh.cloneNode(true),cs=[...cl.querySelectorAll('*')];
  const P=['border-top-width','border-top-style','border-top-color','border-right-width','border-right-style','border-right-color','border-bottom-width','border-bottom-style','border-bottom-color','border-left-width','border-left-style','border-left-color','padding-top','padding-right','padding-bottom','padding-left','font-family','font-size','font-weight','color','text-align','vertical-align','height','border-collapse'];
  live.forEach((e,i)=>{const c=getComputedStyle(e),el=cs[i];if(!el)return;let st='';
    P.forEach(k=>{if(el.tagName==='TABLE'||k!=='border-collapse')st+=k+':'+c.getPropertyValue(k)+';'});
    if(el.tagName==='TD'){st+='width:'+Math.round(e.getBoundingClientRect().width)+'px;'}
    if(el.tagName==='TABLE')st+='width:'+Math.round(e.getBoundingClientRect().width)+'px;table-layout:fixed;';
    if(el.tagName==='TR'||el.tagName==='TD'){const bg=c.backgroundColor;if(el.tagName==='TD'&&bg&&bg!=='rgba(0, 0, 0, 0)')st+='background-color:'+bg+';'}
    el.setAttribute('style',st)});
  [...cl.querySelectorAll('input,textarea')].forEach((e,i)=>{const src=[...sh.querySelectorAll('input,textarea')][i],d=document.createElement('div');d.setAttribute('style','font-size:13px;white-space:pre-wrap;min-height:16px');d.textContent=src.value;e.replaceWith(d)});
  cl.querySelectorAll('img').forEach(i=>i.remove());
  cl.querySelectorAll('.fv').forEach(f=>f.style.whiteSpace='pre-wrap');
  const head='<div style="font-family:Arial,Helvetica,sans-serif;margin:0 0 10px"><b style="font-size:22px">PACK &amp; BOX</b><br><span style="color:#555;font-size:12px">Embalatge per a empreses · Palafrugell, Girona</span></div>';
  const tb=cl.querySelector('table').outerHTML;
  return '<div style="font-family:Arial,Helvetica,sans-serif;color:#000">'+head+tb+'</div>'}
function ordSend(mode){if(!ordCheck())return;const txt=ordText(),su=encodeURIComponent('Comanda '+ordNo+' — '+oq('c_n')),t=T[L];
  let rich=false,html='';
  try{html=ordEmailHTML();if(navigator.clipboard&&window.ClipboardItem){navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]).then(()=>toast(t.ckrc),()=>{});rich=true}}catch(e){rich=false}
  const bd=rich?'':'&body='+encodeURIComponent(txt);
  if(mode==='g')window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+MAIL+'&su='+su+bd,'_blank','noopener');
  else location.href='mailto:'+MAIL+'?subject='+su+bd;
  $('#o-msg').innerHTML=esc(t.cko)+' <button type="button" id="o-c">'+t.ckc+'</button>';
  $('#o-c').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(t.ckcd),()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(t.ckcd)}catch(e){}a.remove()})}}
function ordFile(){if(!ordCheck())return;const live=[...$('#sheet').querySelectorAll('input,textarea')],cl=$('#sheet').cloneNode(true);
  [...cl.querySelectorAll('input,textarea')].forEach((e,i)=>{const s=document.createElement('div');s.className='fv';s.textContent=live[i].value;e.replaceWith(s)});
  const h='<!DOCTYPE html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comanda '+ordNo+' — PACK & BOX</title><style>body{margin:0;padding:20px;background:#fff}'+OCSS+'@media print{body{padding:0}.sheet{padding:0}}</style></head><body>'+cl.outerHTML+'</body></html>';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='comanda-'+ordNo+'.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('#o-x').onclick=closeOrder;$('#o-p').onclick=()=>{if(ordCheck())window.print()};$('#o-d').onclick=ordFile;$('#o-m').onclick=()=>ordSend('m');$('#o-g').onclick=()=>ordSend('g');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ord').classList.contains('open'))closeOrder()});
$('#of').addEventListener('input',e=>{if(e.target.classList)e.target.classList.remove('bad');try{const s={};ordFields.forEach(n=>{const x=$('#of').elements[n];if(x)s[n]=x.value});localStorage.setItem('pb_k',JSON.stringify(s))}catch(x){}});
draw();
